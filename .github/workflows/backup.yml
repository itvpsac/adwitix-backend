# Nightly backup of the database and all user files (photos, logos, KYC
# vault) into BASE/adwitix-backups on the server, beside the site and
# outside the web root; 14 days are kept. Also runnable by hand. The deploy
# separately dumps the database before running migrations. See
# scripts/backup.sh for what is backed up and how to restore.
name: Backup

on:
  schedule:
    - cron: '43 20 * * *' # 02:13 IST
  workflow_dispatch:

concurrency:
  group: deploy-backend # never alongside a deploy
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
            echo "ssh-keyscan attempt $i failed; retrying"; sleep $((i * 5))
          done
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Could not reach the server's SSH port"; exit 1; }

      - name: Back up
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" bash -s <<'REMOTE'
          set -euo pipefail
          BASE=$(dirname "$(dirname "$DEPLOY_PATH")")
          # The newest PHP >= 8.2 with intl/mbstring, as the deploy uses.
          PHP=""
          for c in /opt/alt/php85/usr/bin/php /opt/alt/php84/usr/bin/php /opt/alt/php83/usr/bin/php /opt/alt/php82/usr/bin/php php; do
            bin=$(command -v "$c" 2>/dev/null || true)
            [ -n "$bin" ] || continue
            if "$bin" -r 'exit(PHP_VERSION_ID >= 80200 && extension_loaded("intl") && extension_loaded("mbstring") ? 0 : 1);' 2>/dev/null; then PHP="$bin"; break; fi
          done
          [ -n "$PHP" ] || { echo "No PHP >= 8.2 with intl and mbstring found"; exit 1; }
          PHP_BIN="$PHP" BACKUP_DIR="$BASE/adwitix-backups" bash "$DEPLOY_PATH/scripts/backup.sh"
          echo "== backups on the server"
          ls -lh "$BASE/adwitix-backups" | tail -n +2
          du -sh "$BASE/adwitix-backups"
          REMOTE
