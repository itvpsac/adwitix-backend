# Deploys the backend to the server over SSH, one release at a time.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     server hostname or IP
#   DEPLOY_USER     SSH user that owns DEPLOY_PATH
#   DEPLOY_SSH_KEY  private key whose public half is in that user's
#                   ~/.ssh/authorized_keys
#   DEPLOY_PATH     the site's app path (the docroot that holds public/)
#   DEPLOY_PORT     optional, defaults to 22
#
# Layout beside the site (BASE = two levels above DEPLOY_PATH, outside the
# web root):
#   BASE/adwitix-releases/<time>-<sha>  one complete copy of the app each
#   BASE/adwitix-shared/.env            server config, shared by releases
#   BASE/adwitix-shared/writable/       logs, cache, sessions (persist)
#   BASE/adwitix-storage/               user uploads (app/Config/Storage.php)
#   BASE/adwitix-backups/               database dumps + file archives (backup.yml)
#   DEPLOY_PATH -> the live release     a symlink, switched atomically
#
# A release is built and migrated while the previous one keeps serving, and
# only then does DEPLOY_PATH switch to it with a single rename, so a request
# never sees half-copied code or a half-written vendor/. If the health check
# fails afterwards, DEPLOY_PATH switches back.
#
# Hostinger's own Git deployment is disconnected from this repository (its
# GitHub App no longer has access) and must stay off: it rewrites DEPLOY_PATH
# in place, which is exactly what this avoids. If it runs anyway, this job
# notices, says so, and moves the site back onto a clean release.
name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Host/user/path/port may be repository secrets or variables.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      # Optional override for the persistent user-file directory.
      STORAGE_ROOT: ${{ vars.STORAGE_ROOT }}
      HEALTHCHECK_URL: https://admin.adwitix.com/public/index.php/api/v1/app/tenants
    steps:
      - name: Check deploy secrets
        id: guard
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            for v in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do [ -n "${!v}" ] || echo "::warning::$v is not set (repository secret or variable)"; done
            echo "::warning::Deploy settings missing — skipping deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "RELEASE=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - name: Set up SSH
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "::error::DEPLOY_SSH_KEY secret is not set"; exit 1; fi
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Retry: the host occasionally doesn't answer the first scan.
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
            echo "ssh-keyscan attempt $i failed; retrying"; sleep $((i * 5))
          done
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Could not reach the server's SSH port"; exit 1; }
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Upload release
        if: steps.guard.outputs.ready == 'true'
        run: git archive --format=tar.gz "$GITHUB_SHA" | $SSH "cat > ~/adwitix-$RELEASE.tgz"

      # Everything here happens in the new release folder; the live site is
      # untouched until the next step.
      - name: Build release
        if: steps.guard.outputs.ready == 'true'
        run: |
          $SSH DEPLOY_PATH="$DEPLOY_PATH" RELEASE="$RELEASE" STORAGE_ROOT="$STORAGE_ROOT" bash -s <<'REMOTE'
          set -euo pipefail
          BASE=$(dirname "$(dirname "$DEPLOY_PATH")")
          REL="$BASE/adwitix-releases/$RELEASE"
          SHARED="$BASE/adwitix-shared"
          mkdir -p "$REL" "$SHARED/writable"
          tar -xzf ~/"adwitix-$RELEASE.tgz" -C "$REL"
          rm -f ~/"adwitix-$RELEASE.tgz"

          # The live app folder: the current release, or (before the first
          # release) the folder Hostinger's Git deployment kept in place.
          LIVE=$(readlink -f "$DEPLOY_PATH")
          if [ ! -L "$DEPLOY_PATH" ] && [ -f "$SHARED/.env" ]; then
            echo "::error::$DEPLOY_PATH was replaced by a plain folder — Hostinger's Git auto-deployment is still on. Turn it off in hPanel → Git; this deploy moves the site back onto a release."
          elif [ -d "$DEPLOY_PATH/.git" ] && [ -L "$DEPLOY_PATH" ]; then
            echo "::error::Something wrote a Git checkout into the live release — Hostinger's Git auto-deployment is still on. Turn it off in hPanel → Git."
          fi

          # Shared config and runtime files.
          if [ ! -f "$SHARED/.env" ]; then
            cp "$LIVE/.env" "$SHARED/.env"
            chmod 600 "$SHARED/.env"
            echo "Moved server config to $SHARED/.env"
          fi
          cp -an "$REL/writable/." "$SHARED/writable/"
          mkdir -p "$SHARED/writable/"{cache,debugbar,logs,session,uploads,uploads_staging}
          rm -rf "$REL/writable"
          ln -s "$SHARED/writable" "$REL/writable"
          ln -s "$SHARED/.env" "$REL/.env"

          # Persistent storage for user files (see app/Config/Storage.php).
          STORAGE_ROOT="${STORAGE_ROOT:-$BASE/adwitix-storage}"
          mkdir -p "$STORAGE_ROOT/uploads" "$STORAGE_ROOT/uploads_staging" "$STORAGE_ROOT/kyc_vault"
          # Adopt files still in the old in-tree locations (e.g. restored from
          # a backup into the live folder). Never overwrites, never deletes.
          for pair in "public/uploads:uploads" "writable/uploads_staging:uploads_staging" "writable/kyc_vault:kyc_vault"; do
            src="$LIVE/${pair%%:*}"; dst="$STORAGE_ROOT/${pair##*:}"
            if [ -d "$src" ] && [ ! -L "$src" ]; then cp -an "$src/." "$dst/"; fi
          done
          chmod 700 "$STORAGE_ROOT/kyc_vault"
          if grep -q '^storage\.root' "$SHARED/.env"; then
            sed -i "s|^storage\.root.*|storage.root = $STORAGE_ROOT|" "$SHARED/.env"
          else
            printf '\nstorage.root = %s\n' "$STORAGE_ROOT" >> "$SHARED/.env"
          fi
          echo "User files: $STORAGE_ROOT ($(find "$STORAGE_ROOT/uploads" -type f | wc -l) public, $(find "$STORAGE_ROOT/kyc_vault" -type f | wc -l) KYC)"

          # The default `php` can be older than the site's PHP (Hostinger's CLI
          # is 8.1); use the newest installed PHP >= 8.2 with intl and mbstring,
          # which composer.json and CodeIgniter need.
          PHP=""
          for c in /opt/alt/php85/usr/bin/php /opt/alt/php84/usr/bin/php /opt/alt/php83/usr/bin/php /opt/alt/php82/usr/bin/php \
                   php8.5 php8.4 php8.3 php8.2 php85 php84 php83 php82 php; do
            bin=$(command -v "$c" 2>/dev/null || true)
            [ -n "$bin" ] || continue
            if "$bin" -r 'exit(PHP_VERSION_ID >= 80200 && extension_loaded("intl") && extension_loaded("mbstring") ? 0 : 1);' 2>/dev/null; then PHP="$bin"; break; fi
            echo "Skipping $bin ($("$bin" -r 'echo PHP_VERSION;' 2>/dev/null)): too old or missing intl/mbstring"
          done
          if [ -z "$PHP" ]; then echo "No PHP >= 8.2 with intl and mbstring found on the server"; exit 1; fi
          echo "Using $PHP ($("$PHP" -r 'echo PHP_VERSION;'))"

          cd "$REL"
          COMPOSER=$(command -v composer2 || command -v composer)
          if grep -qa '__HALT_COMPILER' "$COMPOSER"; then
            # composer.phar: run it under the chosen PHP.
            "$PHP" "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction
          else
            # Wrapper script bound to the CLI PHP: the lock file targets the
            # site's PHP, so skip only the PHP version check.
            "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=php
          fi

          # Boots the framework, reads .env and reaches the database: a
          # release that can't do this never goes live.
          "$PHP" spark migrate:status

          # Database dump before anything migrates; no migration without one.
          BACKUP_DIR="$BASE/adwitix-backups" SKIP_MEDIA=1 BACKUP_LABEL=predeploy bash "$REL/scripts/backup.sh"

          # One-off repair: super_admin_credential was created outside the
          # migrator, so 069 kept failing and blocked 071+. No-op once recorded.
          "$PHP" spark migrate:mark-applied 2026-01-01-000069 CreateSuperAdminCredential super_admin_credential
          # spark exits 0 even when a migration throws, so check its output.
          out=$("$PHP" spark migrate 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if printf '%s' "$out" | grep -q 'Exception'; then
            echo "::error::A database migration failed — see the output above. The site stays on the previous release."
            exit 1
          fi
          "$PHP" spark cache:clear || true
          REMOTE

      - name: Switch to the new release
        id: switch
        if: steps.guard.outputs.ready == 'true'
        run: |
          $SSH DEPLOY_PATH="$DEPLOY_PATH" RELEASE="$RELEASE" bash -s <<'REMOTE'
          set -euo pipefail
          BASE=$(dirname "$(dirname "$DEPLOY_PATH")")
          REL="$BASE/adwitix-releases/$RELEASE"
          if [ -L "$DEPLOY_PATH" ]; then
            readlink "$DEPLOY_PATH" > "$BASE/adwitix-releases/.previous"
          else
            # First release (or the host rewrote the folder). Let a Git
            # deployment still writing into it finish first (up to 3 min).
            for i in $(seq 1 18); do
              [ -z "$(find "$DEPLOY_PATH" -maxdepth 2 -newermt '-30 seconds' -print -quit)" ] && break
              echo "The app folder changed in the last 30s; waiting ($i/18)…"; sleep 10
            done
            # Keep the old folder beside the releases so a rollback can
            # restore it.
            old="$BASE/adwitix-releases/folder-$(date -u +%Y%m%d%H%M%S)-$$"
            mv "$DEPLOY_PATH" "$old"
            echo "$old" > "$BASE/adwitix-releases/.previous"
            echo "Moved the old app folder to $old"
          fi
          # A rename over the symlink is atomic: every request sees either
          # the old release or the new one.
          ln -sfn "$REL" "$DEPLOY_PATH.next"
          mv -T "$DEPLOY_PATH.next" "$DEPLOY_PATH"
          echo "Live: $REL"
          REMOTE

      - name: Health check
        if: steps.guard.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTHCHECK_URL" || true)
            echo "GET $HEALTHCHECK_URL → $code"
            [ "$code" = 200 ] && break
            sleep 5
          done
          [ "$code" = 200 ]
          env_code=$(curl -s -o /dev/null -w '%{http_code}' https://admin.adwitix.com/.env || true)
          if [ "$env_code" = 200 ]; then echo "::warning::https://admin.adwitix.com/.env is publicly readable"; fi

      - name: Roll back
        if: failure() && steps.switch.outcome == 'success'
        run: |
          $SSH DEPLOY_PATH="$DEPLOY_PATH" bash -s <<'REMOTE'
          set -euo pipefail
          BASE=$(dirname "$(dirname "$DEPLOY_PATH")")
          prev=$(cat "$BASE/adwitix-releases/.previous")
          if [[ "$(basename "$prev")" == folder-* ]]; then
            # The previous site was a plain folder: put the folder itself
            # back, in case serving through a symlink is what failed.
            rm -f "$DEPLOY_PATH"
            mv "$prev" "$DEPLOY_PATH"
          else
            ln -sfn "$prev" "$DEPLOY_PATH.next"
            mv -T "$DEPLOY_PATH.next" "$DEPLOY_PATH"
          fi
          echo "Rolled back to $prev"
          REMOTE

      - name: Remove old releases
        if: success()
        run: |
          $SSH DEPLOY_PATH="$DEPLOY_PATH" bash -s <<'REMOTE'
          set -eu
          BASE=$(dirname "$(dirname "$DEPLOY_PATH")")
          cd "$BASE/adwitix-releases"
          live=$(basename "$(readlink "$DEPLOY_PATH")")
          # Keep the five newest releases and the two newest old folders.
          { ls -1d 2*-* 2>/dev/null || true; } | sort -r | tail -n +6 | { grep -vx "$live" || true; } | xargs -r rm -rf
          { ls -1d folder-* 2>/dev/null || true; } | sort -r | tail -n +3 | xargs -r rm -rf
          echo "Releases kept: $(ls -1d 2*-* | wc -l)"
          REMOTE
