# Deploys main to the backend server over SSH.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     server hostname or IP
#   DEPLOY_USER     SSH user that owns DEPLOY_PATH; passwordless sudo lets
#                   the job also chown writable/ and reload PHP-FPM
#   DEPLOY_SSH_KEY  private key whose public half is in that user's
#                   ~/.ssh/authorized_keys
#   DEPLOY_PATH     app directory on the server (the one containing spark)
#   DEPLOY_PORT     optional, defaults to 22
#
# Code reaches the server through Hostinger's Git deployment (or a git
# fetch fallback); this job then installs dependencies and migrates.
name: Deploy backend

on:
  push:
    branches: [main]
    # Workflow-only changes don't need a deploy (run it by hand if wanted).
    paths-ignore: ['.github/**']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Host/user/path/port may be repository secrets or variables.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      HEALTHCHECK_URL: https://admin.adwitix.com/public/index.php/api/v1/app/tenants
    steps:
      - name: Check deploy secrets
        id: guard
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            for v in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do [ -n "${!v}" ] || echo "::warning::$v is not set (repository secret or variable)"; done
            echo "::warning::Deploy settings missing — skipping deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "::error::DEPLOY_SSH_KEY secret is not set"; exit 1; fi
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # Hostinger's Git deployment checks out main into DEPLOY_PATH on every
      # push, so the code isn't copied from here (copying raced with it).
      # Wait until the server's checkout is at this commit, pulling it
      # ourselves if Hostinger hasn't within a few minutes.
      - name: Wait for the server checkout
        if: steps.guard.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" SHA="$GITHUB_SHA" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          for i in $(seq 1 18); do
            head=$(git rev-parse HEAD 2>/dev/null || echo none)
            [ "$head" = "$SHA" ] && { echo "Server is at $SHA"; exit 0; }
            echo "Server at $head, waiting for $SHA ($i/18)…"
            sleep 10
          done
          echo "Hostinger hasn't pulled $SHA; fetching it directly."
          git fetch origin main
          git reset --hard "$SHA"
          REMOTE

      - name: Install, migrate, reload
        if: steps.guard.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          SUDO=""
          if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then SUDO="sudo -n"; fi
          # The default `php` can be older than the site's PHP (Hostinger's CLI
          # is 8.1); use the newest installed PHP >= 8.2 with intl and mbstring,
          # which composer.json and CodeIgniter need.
          PHP=""
          for c in /opt/alt/php85/usr/bin/php /opt/alt/php84/usr/bin/php /opt/alt/php83/usr/bin/php /opt/alt/php82/usr/bin/php \
                   php8.5 php8.4 php8.3 php8.2 php85 php84 php83 php82 php; do
            bin=$(command -v "$c" 2>/dev/null || true)
            [ -n "$bin" ] || continue
            # Must also have the extensions CodeIgniter needs (intl, mbstring).
            if "$bin" -r 'exit(PHP_VERSION_ID >= 80200 && extension_loaded("intl") && extension_loaded("mbstring") ? 0 : 1);' 2>/dev/null; then PHP="$bin"; break; fi
            echo "Skipping $bin ($("$bin" -r 'echo PHP_VERSION;' 2>/dev/null)): too old or missing intl/mbstring"
          done
          if [ -z "$PHP" ]; then echo "No PHP >= 8.2 with intl and mbstring found on the server"; exit 1; fi
          echo "Using $PHP ($("$PHP" -r 'echo PHP_VERSION;'))"
          COMPOSER=$(command -v composer2 || command -v composer)
          if grep -qa '__HALT_COMPILER' "$COMPOSER"; then
            # composer.phar: run it under the chosen PHP.
            $SUDO "$PHP" "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction
          else
            # Wrapper script bound to the CLI PHP: the lock file targets the
            # site's PHP, so skip only the PHP version check.
            $SUDO "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=php
          fi
          # One-off repair: super_admin_credential was created outside the
          # migrator, so 069 kept failing and blocked 071+. No-op once recorded.
          $SUDO "$PHP" spark migrate:mark-applied 2026-01-01-000069 CreateSuperAdminCredential super_admin_credential
          $SUDO "$PHP" spark migrate:status || true
          # spark exits 0 even when a migration throws, so check its output.
          if ! out=$($SUDO "$PHP" spark migrate 2>&1); then echo "$out"; exit 1; fi
          echo "$out"
          if printf '%s' "$out" | grep -q 'Exception'; then
            echo "::warning::A database migration failed — see the output above. Later migrations did not run."
          fi
          $SUDO "$PHP" spark cache:clear || true
          if [ -n "$SUDO" ] || [ "$(id -u)" = 0 ]; then
            $SUDO chown -R www-data:www-data writable public/uploads
            for svc in php8.3-fpm php8.2-fpm php-fpm; do
              if systemctl list-unit-files "$svc.service" >/dev/null 2>&1; then
                $SUDO systemctl reload "$svc" && break
              fi
            done
          fi
          REMOTE

      - name: Health check
        if: steps.guard.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTHCHECK_URL")
          echo "GET $HEALTHCHECK_URL → $code"
          [ "$code" = 200 ]
