# Read-only server check, run by hand from the Actions tab. Uses the same
# secrets as deploy.yml; changes nothing on the server.
name: Diagnose server

on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: Listing id whose media URLs to check (optional)
        required: false
      site:
        description: Frontend origin used for the proxied URLs
        required: false
        default: https://adwitix.vercel.app

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: API health
        run: curl -s --max-time 20 -o /dev/null -w 'GET /api/v1/app/tenants → %{http_code}\n' https://admin.adwitix.com/public/index.php/api/v1/app/tenants || true

      - name: Listing media
        if: inputs.listing_id != ''
        env:
          LISTING_ID: ${{ inputs.listing_id }}
          SITE: ${{ inputs.site }}
        run: |
          api="https://admin.adwitix.com/public/index.php/api/v1/app/listings/$LISTING_ID"
          body=$(curl -s --max-time 20 "$api")
          echo "GET $api → $(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "$api")"
          echo "$body" | jq '{status, message, listing_status: .data.listing.status, missing_media: .data.missingMediaCount, media: [.data.media[]? | {media_type, file_path, is_primary}], queued: .data.queuedMediaJobs}'
          for p in $(echo "$body" | jq -r '.data.media[]?.file_path'); do
            for url in "$SITE/$p" "https://admin.adwitix.com/public/$p" "https://admin.adwitix.com/$p"; do
              echo "$(curl -s --max-time 20 -o /dev/null -w '%{http_code} %{content_type}' "$url")  $url"
            done
          done

      - name: Reproduce intermittent errors
        run: |
          for url in \
            "https://admin.adwitix.com/public/index.php/api/v1/app/tenants" \
            "https://admin.adwitix.com/public/uploads/listings/none/none.webp"; do
            codes=""
            for i in $(seq 1 20); do
              code=$(curl -s --max-time 20 -o /tmp/body -w '%{http_code}' "$url")
              codes="$codes $code"
              if [ "${code:0:1}" = 5 ]; then echo "--- $code body from $url (request $i):"; head -c 1500 /tmp/body; echo; fi
            done
            echo "$url →$codes"
          done

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Retry: the host occasionally doesn't answer the first scan.
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
            echo "ssh-keyscan attempt $i failed; retrying"; sleep $((i * 5))
          done
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Could not reach the server's SSH port"; exit 1; }

      - name: Inspect server
        env:
          LISTING_ID: ${{ inputs.listing_id }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" LISTING_ID="$LISTING_ID" bash -s <<'REMOTE'
          echo "== deploy dir"; ls -la "$DEPLOY_PATH" 2>&1 | head -40
          echo "== app/"; ls -la "$DEPLOY_PATH/app" 2>&1 | head -30
          echo "== storage"; root=$(grep '^storage\.root' "$DEPLOY_PATH/.env" | sed 's/^[^=]*= *//'); echo "storage.root = ${root:-<unset>}"
          [ -n "$root" ] && { ls -la "$root" 2>&1; echo "public files: $(find "$root/uploads" -type f 2>/dev/null | wc -l), KYC files: $(find "$root/kyc_vault" -type f 2>/dev/null | wc -l)"; }
          [ -n "$root" ] && [ -n "$LISTING_ID" ] && ls -la "$root/uploads/listings/$LISTING_ID" 2>&1 | head -20
          echo "== public/uploads/listings"; ls "$DEPLOY_PATH/public/uploads/listings" 2>&1 | head -20
          [ -n "$LISTING_ID" ] && { echo "== files for $LISTING_ID"; ls -la "$DEPLOY_PATH/public/uploads/listings/$LISTING_ID" 2>&1 | head -20; }
          echo "== public/.htaccess"; cat "$DEPLOY_PATH/public/.htaccess" 2>&1 | head -40
          echo "== docroot .htaccess"; cat "$DEPLOY_PATH/.htaccess" 2>&1 | head -40
          echo "== CodeIgniter log (latest, errors only)"
          latest=$(ls -t "$DEPLOY_PATH"/writable/logs/log-*.log 2>/dev/null | head -1)
          if [ -n "$latest" ]; then echo "$latest"; grep -E '^(ERROR|CRITICAL|ALERT|EMERGENCY)' "$latest" | tail -40; else echo "no CodeIgniter log files"; fi
          echo "== PHP error_log files"
          find "$DEPLOY_PATH" "$(dirname "$DEPLOY_PATH")" -maxdepth 3 -name 'error_log' -newermt '-2 days' 2>/dev/null | while read -r f; do echo "-- $f"; tail -30 "$f"; done
          [ -d "$HOME/logs" ] && { echo "== ~/logs"; ls -la "$HOME/logs" | head; }
          echo "== releases (permissions)"; base=$(dirname "$(dirname "$DEPLOY_PATH")")
          for r in $(ls -1d "$base"/adwitix-releases/2* 2>/dev/null | tail -3); do stat -c '%A %U %n' "$r" "$r/public" "$r/public/index.php" "$r/.env" "$r/writable" 2>&1; done
          stat -c '%A %U %n' "$base/adwitix-shared" "$base/adwitix-shared/.env" "$base/adwitix-shared/writable" "$base/adwitix-backups" 2>&1
          echo "== disk"; df -h "$DEPLOY_PATH" 2>&1; df -i "$DEPLOY_PATH" 2>&1
          echo "== quota"; quota -s 2>&1 | head -10 || true
          echo "== try mkdir"; d="$DEPLOY_PATH/.deploy-probe-$$"; mkdir "$d" && echo "mkdir ok" && rmdir "$d"
          echo "== mount"; mount 2>/dev/null | grep -E " $(df --output=target "$DEPLOY_PATH" | tail -1) " || true
          REMOTE

      - name: Tenant census (read-only)
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" DEPLOY_PATH="$DEPLOY_PATH" bash -s <<'REMOTE'
          PHP=""
          for bin in /opt/alt/php84/usr/bin/php /opt/alt/php83/usr/bin/php /usr/bin/php php; do
            if "$bin" -r 'exit(PHP_VERSION_ID >= 80200 ? 0 : 1);' 2>/dev/null; then PHP="$bin"; break; fi
          done
          cnf=$(mktemp); trap 'rm -f "$cnf"' EXIT
          db=$("$PHP" "$DEPLOY_PATH/spark" backup:mysql-config "$cnf" | tail -1)
          mysql --defaults-extra-file="$cnf" -t "$db" <<'SQL'
          SELECT t.id, t.name, t.tenant_class, t.subscription_tier, t.subdomain, t.suspended_at,
                 (SELECT COUNT(*) FROM listing l WHERE l.tenant_id = t.id) AS lots,
                 (SELECT COUNT(*) FROM listing l WHERE l.tenant_id = t.id AND l.archived_at IS NULL) AS live_lots,
                 (SELECT COUNT(*) FROM sale_event s WHERE s.tenant_id = t.id) AS sessions,
                 (SELECT COUNT(*) FROM party_role r WHERE r.tenant_id = t.id) AS roles
          FROM tenant t ORDER BY t.name;
          SQL
          REMOTE
